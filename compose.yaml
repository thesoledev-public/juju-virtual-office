services:
  juju-office-web:
    build: .
    container_name: juju-office-web
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - npm_proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4381/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  npm_proxy:
    external: true
